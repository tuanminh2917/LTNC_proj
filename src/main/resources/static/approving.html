<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phê duyệt kế hoạch</title>
    <link rel="stylesheet" href="css/approving.css">
    <link rel="stylesheet" href="css/header.css">
</head>
<body>
    <header>
        <p id="home-link">Trang chủ</p>
        <div>
            <p id="user_official_name">Tên người dùng: <span></span></p>
            <p id="user_id">Mã người dùng: <span></span></p>
            <p id="user_role">Vai trò: <span></span></p>
        </div>
    </header>

    <div class="container">
        <h1>Phê duyệt kế hoạch</h1>

        <div class="plan-search">
            <h2>Tìm kiếm kế hoạch</h2>
            <select id="planTypeSelect">
                <option value="">Chọn loại kế hoạch</option>
                <option value="Định kỳ">Định kỳ</option>
                <option value="Đột xuất">Đột xuất</option>
            </select>
            <select id="planStatusSelect">
                <option value="">Chọn trạng thái</option>
                <option value="Chờ phê duyệt">Chờ phê duyệt</option>
                <option value="Đã phê duyệt">Đã phê duyệt</option>
                <option value="Bị từ chối">Bị từ chối</option>
            </select>
            <input type="text" id="yearInput" placeholder="Nhập năm">
            <button id="searchPlanBtn">Tìm kiếm</button>
        </div>

        <div class="plan-list">
            <h2>Danh sách kế hoạch</h2>
            <!-- JS sẽ render kế hoạch vào đây -->
        </div>
    </div>

    <script src="js/approving.js"></script>
</body>
</html>
