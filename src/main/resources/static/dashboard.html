<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

    <div class="container">
        <h1>Trang chính hệ thống</h1>

        <div class="info">

        <button id="logoutBtn">Đăng xuất</button>

        <p id="message"></p>
    </div>

    <script src="/js/dashboard.js"></script>
</body>
</html>
