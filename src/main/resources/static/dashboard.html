<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <div class="container">
        <h1>Trang chính hệ thống</h1>

        <div class="info">
            <p><b>Tài khoản:</b> <span id="username"></span></p>
            <p><b>Tên đơn vị:</b> <span id="officialName"></span></p>
            <p><b>Vai trò:</b> <span id="role"></span></p>
        </div>

        <button id="logoutBtn">Đăng xuất</button>

        <p id="message"></p>
    </div>

    <div class="container">
    <h1>Quản lý Hệ thống</h1>

    <button class="menu-parent" onclick="toggleEquipmentListMenu()">
        Danh sách trang thiết bị
    </button>
    
    <div class="submenu" id="equipmentSubmenu">
        <div class="sub-option" id="addEquip">Thêm thiết bị</div>
        <div class="sub-option" id="updateEquip">Cập nhật thông tin thiết bị</div>
        <div class="sub-option" id="deleteEquip">Xoá thiết bị</div>
    </div>

    <button class="menu-parent" onclick="toggleEquipRecordMenu()">
        Hồ sơ trang thiết bị
    </button>
        <!--submenu only ONE sub-option -->
    <div class="submenu" id="equipRecordSubmenu">
        <div class="sub-option" id="funcEquipRecord">Thêm, Cập nhật, Xóa Hồ sơ trang thiết bị</div>
    </div>
        
    <button class="menu-parent" onclick="toggleMaintenanceMenu()">
        Bảo dưỡng, sửa chữa
    </button>

        <div class="submenu" id="maintenanceSubmenu">
            <div class="sub-option" id="funcRepairPlan">Kế hoạch sửa chữa</div>
            <div class="sub-option" id="funcAnnuallyPlan">Kế hoạch bảo dưỡng, thay thế</div>
            <div class="sub-option" id="funcApprovingPlan">Phê duyệt kế hoạch</div>
        </div>

    <div id="message"></div>

    <script src="/js/dashboard.js"></script>
</body>
</html>
