
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ trang thiết bị</title>
    <link rel="stylesheet" href="css/equipRecord.css">
    <link rel="stylesheet" href="css/header.css">
</head>
<body>
    <header>
        <p id="home-link">Trang chủ</p>

        <div>
            <p id="user_official_name">Tên người dùng: <span>{{userOfficialName}}</span></p>
            <p id="user_id">Mã người dùng: <span>{{userId}}</span></p>
            <p id="user_role">Vai trò: <span>{{userRole}}</span></p>
        </div>
    </header>
    <div class="container">
        <h1>HỒ SƠ TRANG THIẾT BỊ</h1>
        
        <div class="info-section">
            <div class="info-row">
                <span class="label">Tên trang thiết bị:</span>
                <span class="field-line" style="width: 70%;" id="equip-name-field"></span>
            </div>
            
            <div class="flex-row" style="margin-bottom: 15px;">
                <div class="flex-cell" style="width: 50%;">
                    <span class="label">Mã số: <input type="text" class="field-line" id="equip-id-field"></span>
                </div>
                <div class="flex-cell" style="width: 50%; text-align: right;">
                    <span class="label">Ngày nhận:</span>
                    <span class="field-line" style="width: 55%;" id="receive-date-field"></span>
                </div>
            </div>

            <div class="info-row">
                <span class="label">Đơn vị sử dụng:</span>
                <span class="field-line" style="width: 71%;" id="user-field"></span>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th class="stt">Mã bản ghi</th>
                    <th class="date">Ngày thực hiện</th>
                    <th class="content">Nội dung bảo trì, sửa chữa</th>
                    <th class="person">Người thực hiện</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>1</td><td></td><td></td><td></td><td><button>Xóa</button></td></tr>
                <tr><td>2</td><td></td><td></td><td></td><td><button>Xóa</button></td></tr>
                <tr><td>3</td><td></td><td></td><td></td><td><button>Xóa</button></td></tr>
                <tr><td>4</td><td></td><td></td><td></td><td><button>Xóa</button></td></tr>
                <tr><td>5</td><td></td><td></td><td></td><td><button>Xóa</button></td></tr>
            </tbody>
        </table>

        <button class="add-btn">Thêm hàng</button>
        <button class="save-btn">Lưu</button>

        
    </div>
</body>

<script src="js/equipRecord.js"></script>
</html>
