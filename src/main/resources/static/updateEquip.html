<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện Quản lý Thiết bị</title>
    <link rel="stylesheet" href="/css/updateEquip.css">
</head>
<body>

    <div class="container" id="search-section">
        <div class="section-title">Tìm kiếm</div>
        
        <div class="input-group-container">
            <div class="input-row">
                <label>Mã thiết bị</label>
                <input type="text">
            </div>
            <div class="input-row">
                <label>Tên</label>
                <input type="text">
            </div>
            <div class="input-row">
                <label>Nước sản xuất</label>
                <input type="text">
            </div>
            <div class="input-row">
                <label>Ngày tiếp nhận</label>
                <!--date input-->
                <input type="date">
            </div>
            <div class="input-row">
                <label>Đơn vị</label>
                <!-- <input type="text"> -->
                 <select name="" id="">
                    <option value=null selected>Chọn đơn vị</option>
                    <option value="1">Lãnh đạo Cục</option>
                    <option value="2">Văn phòng Cục</option>
                    <option value="3">Phòng Đăng ký thuốc</option>
                    <option value="4">Phòng Quản lý giá thuốc</option>
                    <option value="5">Phòng Quản lý chất lượng thuốc</option>
                    <option value="6">Phòng Quản lý kinh doanh dược</option>
                    <option value="7">Phòng Quản lý Mỹ phẩm</option>
                    <option value="8">Phòng Pháp chế - Hội nhập</option>
                    <option value="9">Trung tâm Đào tạo và hỗ trợ Doanh nghiệp dược, mỹ phẩm</option>
                 </select>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 15%;">Mã thiết bị</th>
                    <th style="width: 35%;">Tên</th>
                    <th style="width: 25%;">Nước sản xuất</th>
                    <th style="width: 25%;">Ngày tiếp nhận</th>
                    <th style="width: 10%;">Đơn vị</th>
                </tr>
            </thead>
            <tbody>
                <tr><td></td><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>

        <div class="footer-actions">
            <button class="btn" id="searchBtn">Tìm kiếm</button>
        </div>
    </div>

    <div class="container" id="update-section">
        <div class="section-title">Cập nhật</div>
        
        <div class="input-group-container">

            <div class="input-row">

            <div class="input-row">

                <input type="text">
            </div>
            <div class="input-row">
                <label>Ngày tiếp nhận</label>
                <!--date input-->
                <input type="date">
            </div>
            <div class="input-row">
                <label>Đơn vị</label>
                <!-- <input type="text"> -->
                 <select name="" id="">
                    <option value="1">Lãnh đạo Cục</option>
                    <option value="2">Văn phòng Cục</option>
                    <option value="3">Phòng Đăng ký thuốc</option>
                    <option value="4">Phòng Quản lý giá thuốc</option>
                    <option value="5">Phòng Quản lý chất lượng thuốc</option>
                    <option value="6">Phòng Quản lý kinh doanh dược</option>
                    <option value="7">Phòng Quản lý Mỹ phẩm</option>

        <div style="display: flex; align-items: center;">
            <table style="flex-grow: 1;">
                <thead>
                    <tr>
                        <th style="width: 15%;">Mã thiết bị</th>
                        <th style="width: 35%;">Tên</th>
                        <th style="width: 25%;">Nước sản xuất</th>
                        <th style="width: 25%;">Ngày tiếp nhận</th>
                        <th style="width: 10%;">Đơn vị</th>
